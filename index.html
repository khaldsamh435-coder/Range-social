<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rang - تسجيل الدخول</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">

  <meta
    name="theme-color"
    content="#6c5ce7"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Range Social"
  >

  <link
    rel="apple-touch-icon"
    href="/icons/icon-192.png"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        #bca5e0,
        #a992be
      );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;

      background: white;

      border-radius: 25px;

      padding: 30px 25px;

      box-shadow:
        0 15px 40px rgba(0,0,0,.2);
    }

    .logo {
      text-align: center;

      font-size: 42px;

      font-weight: bold;

      color: #7c3aed;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #666;

      margin-bottom: 25px;
    }

    label {
      display: block;

      margin: 12px 0 7px;

      font-weight: bold;

      color: #333;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 1px solid #ddd;

      border-radius: 12px;

      font-size: 16px;

      outline: none;
    }

    input:focus {
      border-color: #7c3aed;
    }

    button {
      width: 100%;

      margin-top: 20px;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background: #7c3aed;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .message {
      margin-top: 15px;

      text-align: center;

      font-weight: bold;

      min-height: 25px;
    }

    .signup {
      text-align: center;

      margin-top: 20px;

      color: #666;
    }

    .signup a {
      color: #7c3aed;

      font-weight: bold;

      text-decoration: none;
    }

    /* زر تثبيت التطبيق */

    #installAppBtn {
      display: none;

      width: 100%;

      margin-top: 15px;

      padding: 13px;

      border: none;

      border-radius: 12px;

      background: #6c5ce7;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    #installAppBtn:hover {
      background: #5b4bc4;
    }

  </style>

</head>


<body>

  <div class="box">

    <div class="logo">
      Rang
    </div>

    <div class="subtitle">
      شبكة المدرسة التعليمية
    </div>


    <form id="loginForm">

      <label>
        البريد الإلكتروني
      </label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >


      <label>
        كلمة المرور
      </label>

      <input
        type="password"
        id="password"
        placeholder="أدخل كلمة المرور"
        required
      >


      <button
        type="submit"
        id="loginButton"
      >
        تسجيل الدخول
      </button>


      <div
        class="message"
        id="message"
      ></div>

    </form>


    <div class="signup">

      ليس لديك حساب؟

      <a href="signup.html">
        إنشاء حساب جديد
      </a>

    </div>


    <!-- زر تثبيت Range Social -->

    <button
      id="installAppBtn"
      type="button"
    >
      تثبيت تطبيق Range Social
    </button>

  </div>



  <script>

    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");


    form.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        message.textContent =
          "جاري تسجيل الدخول...";


        message.style.color =
          "#7c3aed";


        loginButton.disabled =
          true;


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({

                email: email,

                password: password

              });


          if (error) {
            throw error;
          }


          const user =
            data.user;


          const {
            data: profile,
            error: profileError
          } =
            await supabaseClient
              .from("profiles")
              .select("*")
              .eq("id", user.id)
              .single();


          if (profileError) {

            throw new Error(
              "تم تسجيل الدخول، لكن بيانات الحساب غير موجودة."
            );

          }


          localStorage.setItem(
            "rangUser",
            JSON.stringify(profile)
          );


          localStorage.setItem(
            "rangLoggedIn",
            "true"
          );


          message.textContent =
            "تم تسجيل الدخول بنجاح ✅";


          message.style.color =
            "green";


          setTimeout(function() {

            if (
              profile.account_type ===
              "teacher"
            ) {

              window.location.href =
                "teacher.html";

            } else {

              window.location.href =
                "home.html";

            }

          }, 700);


        } catch (error) {

          console.error(error);


          message.textContent =
            error.message ||
            "حدث خطأ أثناء تسجيل الدخول";


          message.style.color =
            "red";


          loginButton.disabled =
            false;

        }

      }
    );

  </script>



  <!-- PWA Install -->

  <script>

    let deferredPrompt = null;


    const installAppBtn =
      document.getElementById(
        "installAppBtn"
      );


    window.addEventListener(
      "beforeinstallprompt",
      function(event) {

        event.preventDefault();

        deferredPrompt = event;

        installAppBtn.style.display =
          "block";

      }
    );


    installAppBtn.addEventListener(
      "click",
      async function() {

        if (!deferredPrompt) {
          return;
        }


        deferredPrompt.prompt();


        const result =
          await deferredPrompt.userChoice;


        console.log(
          "Install result:",
          result.outcome
        );


        deferredPrompt = null;


        installAppBtn.style.display =
          "none";

      }
    );


    window.addEventListener(
      "appinstalled",
      function() {

        deferredPrompt = null;

        installAppBtn.style.display =
          "none";

        console.log(
          "Range Social installed"
        );

      }
    );

  </script>



  <!-- Service Worker -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register(
              "/service-worker.js"
            )

            .then(
              function(registration) {

                console.log(
                  "Service Worker registered:",
                  registration.scope
                );

              }
            )

            .catch(
              function(error) {

                console.error(
                  "Service Worker error:",
                  error
                );

              }
            );

        }
      );

    }

  </script>


</body>

</html>
