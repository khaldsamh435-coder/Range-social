
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rang - تسجيل الدخول</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Range Social">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #bca5e0, #a992be);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 25px;
      padding: 30px 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      color: #7c3aed;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #7c3aed;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      min-height: 25px;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .signup a {
      color: #7c3aed;
      font-weight: bold;
      text-decoration: none;
    }

    #installAppBtn {
      display: none;
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #6c5ce7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #installAppBtn:hover {
      background: #5b4bc4;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="logo">Rang</div>

    <div class="subtitle">شبكة المدرسة التعليمية</div>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        autocomplete="username"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        type="password"
        id="password"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton" disabled>
        جاري التحقق...
      </button>

      <div class="message" id="message" role="status"></div>
    </form>

    <div class="signup">
      ليس لديك حساب؟
      <a href="signup.html">إنشاء حساب جديد</a>
    </div>

    <button id="installAppBtn" type="button">
      تثبيت تطبيق Range Social
    </button>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    let checkingSession = true;

    function showMessage(text, color = "#7c3aed") {
      message.textContent = text;
      message.style.color = color;
    }

    function setLoginEnabled(enabled) {
      loginButton.disabled = !enabled;
      emailInput.disabled = !enabled;
      passwordInput.disabled = !enabled;
      loginButton.textContent = enabled
        ? "تسجيل الدخول"
        : "جاري التحقق...";
    }

    async function openUserPage(user) {
      const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

      if (error) {
        throw error;
      }

      if (!profile) {
        throw new Error("لم يتم العثور على بيانات حسابك في profiles.");
      }

      localStorage.setItem("rangUser", JSON.stringify(profile));
      localStorage.setItem("rangLoggedIn", "true");

      const destination =
        profile.account_type === "teacher"
          ? "teacher.html"
          : "home.html";

      window.location.replace(destination);
    }

    async function restoreSession() {
      try {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        if (data.session && data.session.user) {
          showMessage("تم العثور على جلستك، جاري فتح حسابك...");
          await openUserPage(data.session.user);
          return;
        }

        setLoginEnabled(true);
        showMessage("");
      } catch (error) {
        console.error("Session restore error:", error);
        setLoginEnabled(true);
        showMessage(
          "تعذر استعادة الجلسة. يمكنك تسجيل الدخول من جديد.",
          "#b91c1c"
        );
      } finally {
        checkingSession = false;
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (checkingSession) return;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      setLoginEnabled(false);
      showMessage("جاري تسجيل الدخول...");

      try {
        const { data, error } = await supabaseClient.auth
          .signInWithPassword({ email, password });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error("لم يتم العثور على بيانات المستخدم.");
        }

        showMessage("تم تسجيل الدخول، جاري فتح حسابك...");
        await openUserPage(data.user);
      } catch (error) {
        console.error("Login error:", error);

        showMessage(
          error.message || "حدث خطأ أثناء تسجيل الدخول.",
          "#b91c1c"
        );

        setLoginEnabled(true);
      }
    });

    restoreSession();

    let deferredPrompt = null;
    const installAppBtn = document.getElementById("installAppBtn");

    window.addEventListener("beforeinstallprompt", function(event) {
      event.preventDefault();
      deferredPrompt = event;
      installAppBtn.style.display = "block";
    });

    installAppBtn.addEventListener("click", async function() {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();
      await deferredPrompt.userChoice;

      deferredPrompt = null;
      installAppBtn.style.display = "none";
    });

    window.addEventListener("appinstalled", function() {
      deferredPrompt = null;
      installAppBtn.style.display = "none";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker
          .register("/service-worker.js")
          .catch(function(error) {
            console.error("Service Worker error:", error);
          });
      });
    }
  </script>
</body>
</html>
