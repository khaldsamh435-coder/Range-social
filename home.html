<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Range Social - الصفحة الرئيسية</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<style>

:root{
  --primary:#6c5ce7;
  --primary-hover:#5b4bc4;
  --bg:#f4f6f9;
  --text:#2d3436;
  --muted:#636e72;
  --card:#fff;
  --border:#e2e8f0;
  --danger:#e74c3c;
  --success:#00b894;
  --shadow:0 4px 15px rgba(0,0,0,.05);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Tajawal",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.navbar{
  position:sticky;
  top:0;
  z-index:1000;
  height:65px;
  background:#fff;
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);
}

.nav-container{
  max-width:1200px;
  height:100%;
  margin:auto;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:var(--primary);
  font-size:25px;
  font-weight:700;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}

.search-box{
  flex:1;
  max-width:430px;
  position:relative;
}

.search-box input{
  width:100%;
  border:1px solid var(--border);
  background:#f7f7fb;
  border-radius:25px;
  padding:11px 45px 11px 15px;
  outline:none;
}

.search-box input:focus{
  border-color:var(--primary);
}

.search-box i{
  position:absolute;
  right:17px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  border:none;
  background:#f4f4fa;
  width:40px;
  height:40px;
  border-radius:50%;
  color:var(--text);
}

.icon-btn:hover{
  color:var(--primary);
}

.nav-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.page-container{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px 80px;
}

.layout{
  display:flex;
  gap:25px;
  align-items:flex-start;
}

.sidebar{
  width:250px;
  flex-shrink:0;
}

.main-content{
  flex:1;
  min-width:0;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.profile-mini{
  padding:20px;
  text-align:center;
}

.profile-mini img{
  width:75px;
  height:75px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:8px;
}

.profile-mini h3{
  font-size:17px;
  margin-bottom:4px;
}

.profile-mini p{
  color:var(--muted);
  font-size:13px;
}

.side-menu{
  padding:10px;
}

.menu-btn{
  width:100%;
  border:none;
  background:transparent;
  padding:13px;
  border-radius:10px;
  text-align:right;
  font-size:15px;
  color:var(--text);
  margin-bottom:3px;
}

.menu-btn i{
  width:27px;
  color:var(--primary);
}

.menu-btn:hover,
.menu-btn.active{
  background:#f0edff;
  color:var(--primary);
}

.logout-btn,
.logout-btn i{
  color:var(--danger);
}

.section{
  display:none;
}

.section.active{
  display:block;
}

/* إنشاء منشور */

.create-post{
  padding:18px;
}

.create-top{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.create-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
}

.post-textarea{
  flex:1;
  min-height:85px;
  resize:vertical;
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
  outline:none;
  font-size:15px;
  background:#fafbfc;
}

.post-textarea:focus{
  border-color:var(--primary);
  background:#fff;
}

.selected-file{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#f3f1ff;
  color:var(--primary);
  align-items:center;
  justify-content:space-between;
}

.selected-file.show{
  display:flex;
}

.remove-file{
  border:none;
  background:none;
  color:var(--danger);
}

.create-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--border);
  margin-top:15px;
  padding-top:12px;
}

.media-actions{
  display:flex;
  gap:5px;
}

.media-btn{
  border:none;
  background:transparent;
  padding:9px;
  border-radius:9px;
  color:var(--muted);
}

.media-btn:hover{
  background:#f3f1ff;
  color:var(--primary);
}

.publish-btn{
  border:none;
  background:var(--primary);
  color:white;
  padding:10px 22px;
  border-radius:9px;
  font-weight:700;
}

.publish-btn:hover{
  background:var(--primary-hover);
}

.publish-btn:disabled{
  opacity:.6;
}

/* المنشورات */

.post-card{
  padding:18px;
}

/* المنشور الترحيبي */

.welcome-post{
  border:1px solid #dcd5ff;
  background:#fff;
}

.welcome-post .post-author-name{
  color:var(--primary);
}

.welcome-post .post-text{
  line-height:2;
  font-size:15px;
}

/* علامة المطور */

.developer-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:var(--primary);
  font-size:11px;
  margin-right:5px;
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-author-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
}

.post-author{
  flex:1;
}

.post-author-name{
  font-weight:700;
}

.post-time{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.post-text{
  margin-top:15px;
  line-height:1.9;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-media{
  width:100%;
  max-height:600px;
  object-fit:contain;
  background:#f2f2f2;
  border-radius:12px;
  margin-top:14px;
}

.post-actions{
  display:flex;
  gap:5px;
  border-top:1px solid var(--border);
  margin-top:15px;
  padding-top:10px;
}

.post-action{
  flex:1;
  border:none;
  background:transparent;
  padding:10px;
  border-radius:9px;
  color:var(--muted);
}

.post-action:hover{
  background:#f5f5f7;
  color:var(--primary);
}

.post-action.liked{
  color:#e74c3c;
  font-weight:700;
}

/* التعليقات */

.comments-box{
  display:none;
  border-top:1px solid var(--border);
  margin-top:10px;
  padding-top:12px;
}

.comments-box.open{
  display:block;
}

.comment-list{
  max-height:300px;
  overflow-y:auto;
}

.comment{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.comment-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.comment-content{
  background:#f4f5f7;
  border-radius:12px;
  padding:8px 11px;
  flex:1;
}

.comment-name{
  font-weight:700;
  font-size:13px;
}

.comment-text{
  margin-top:3px;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-form{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.comment-input{
  flex:1;
  border:1px solid var(--border);
  border-radius:20px;
  padding:10px 14px;
  outline:none;
}

.comment-send{
  width:42px;
  border:none;
  border-radius:50%;
  background:var(--primary);
  color:white;
}

.empty-comments{
  text-align:center;
  color:var(--muted);
  padding:12px;
  font-size:13px;
}

/* الأصدقاء */

.section-title{
  margin-bottom:15px;
  font-size:21px;
}

.search-friend{
  padding:15px;
  display:flex;
  gap:10px;
}

.search-friend input{
  flex:1;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px;
  outline:none;
}

.primary-btn{
  border:none;
  background:var(--primary);
  color:white;
  padding:10px 18px;
  border-radius:9px;
}

.friend-result,
.friend-item,
.request-item{
  padding:15px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
}

.friend-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
}

.friend-info{
  flex:1;
}

.friend-info strong{
  display:block;
}

.friend-info small{
  color:var(--muted);
}

.small-btn{
  border:none;
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
}

.accept-btn{
  background:var(--success);
  color:white;
}

.reject-btn{
  background:#eee;
  color:var(--danger);
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

/* الاختبارات */

.test-card{
  padding:18px;
}

.test-card h3{
  margin-bottom:6px;
}

.test-meta{
  color:var(--muted);
  font-size:13px;
}

.question{
  border-top:1px solid var(--border);
  margin-top:15px;
  padding-top:15px;
}

.question-title{
  font-weight:700;
  margin-bottom:10px;
}

.option{
  display:block;
  background:#fafafa;
  border:1px solid var(--border);
  border-radius:9px;
  padding:10px;
  margin:7px 0;
  cursor:pointer;
}

.message{
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  font-size:14px;
}

.success{
  background:#eafaf5;
  color:#008f72;
}

.error{
  background:#ffecec;
  color:#c0392b;
}

/* شريط الهاتف */

.mobile-nav{
  display:none;
}

.mobile-nav-btn{
  border:none;
  background:transparent;
  color:#777;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-width:55px;
  flex:1;
  height:60px;
}

.mobile-nav-btn i{
  font-size:19px;
}

.mobile-nav-btn.active{
  color:var(--primary);
}

.mobile-nav-btn.logout-mobile{
  color:var(--danger);
}

/* التابلت */

@media(max-width:1024px){

  .sidebar{
    width:210px;
  }

}

/* الهاتف */

@media(max-width:768px){

  .navbar{
    height:60px;
  }

  .nav-container{
    padding:0 10px;
  }

  .logo{
    font-size:21px;
  }

  .search-box{
    display:none;
  }

  .sidebar{
    display:none;
  }

  .layout{
    display:block;
  }

  .page-container{
    margin-top:15px;
    padding:0 10px 80px;
  }

  .mobile-nav{
    position:fixed;
    display:flex;
    align-items:center;
    justify-content:space-around;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:#fff;
    border-top:1px solid var(--border);
    box-shadow:0 -4px 15px rgba(0,0,0,.08);
    z-index:2000;
    padding:2px 4px;
  }

  .post-card,
  .create-post{
    padding:14px;
  }

  .post-actions{
    gap:0;
  }

  .post-action{
    font-size:13px;
    padding:9px 4px;
  }

  .create-top{
    gap:8px;
  }

  .create-avatar{
    width:42px;
    height:42px;
  }

  .post-textarea{
    min-height:75px;
  }

  .friend-result,
  .friend-item,
  .request-item{
    flex-wrap:wrap;
  }

  .friend-info{
    min-width:130px;
  }

}

@media(max-width:400px){

  .nav-actions{
    gap:4px;
  }

  .icon-btn{
    width:36px;
    height:36px;
  }

  .nav-avatar{
    width:36px;
    height:36px;
  }

  .logo{
    font-size:19px;
  }

  .post-action{
    font-size:12px;
  }

}

</style>

</head>

<body>


<header class="navbar">

  <div class="nav-container">

    <a class="logo" href="#">
      <i class="fa-solid fa-shapes"></i>
      Rang
    </a>

    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        id="topSearch"
        placeholder="ابحث في Rang..."
      >

    </div>

    <div class="nav-actions">

      <button
        class="icon-btn"
        onclick="showSection('friendsSection')"
        title="الأصدقاء"
      >
        <i class="fa-solid fa-user-group"></i>
      </button>

      <button
        class="icon-btn"
        onclick="loadAllData()"
        title="تحديث"
      >
        <i class="fa-solid fa-rotate"></i>
      </button>

      <img
        id="navAvatar"
        class="nav-avatar"
        src="https://ui-avatars.com/api/?name=Rang"
        alt="الصورة الشخصية"
      >

    </div>

  </div>

</header>


<div class="page-container">

  <div class="layout">


    <!-- القائمة الجانبية -->

    <aside class="sidebar">

      <div class="card profile-mini">

        <img
          id="sideAvatar"
          src="https://ui-avatars.com/api/?name=Rang"
          alt="الصورة الشخصية"
        >

        <h3 id="sideName">
          مستخدم Rang
        </h3>

        <p id="sideUsername">
          @rang_user
        </p>

      </div>


      <div class="card side-menu">

        <button
          class="menu-btn active"
          onclick="showSection('homeSection',this)"
        >
          <i class="fa-solid fa-house"></i>
          الرئيسية
        </button>

        <button
          class="menu-btn"
          onclick="showSection('friendsSection',this)"
        >
          <i class="fa-solid fa-user-group"></i>
          الأصدقاء
        </button>

        <button
          class="menu-btn"
          onclick="showSection('testsSection',this)"
        >
          <i class="fa-solid fa-file-pen"></i>
          الاختبارات
        </button>

        <button
          class="menu-btn"
          onclick="showSection('profileSection',this)"
        >
          <i class="fa-solid fa-user"></i>
          الملف الشخصي
        </button>

        <button
          class="menu-btn logout-btn"
          onclick="logout()"
        >
          <i class="fa-solid fa-right-from-bracket"></i>
          تسجيل الخروج
        </button>

      </div>

    </aside>


    <main class="main-content">


      <!-- الرئيسية -->

      <section
        id="homeSection"
        class="section active"
      >


        <!-- إنشاء منشور -->

        <div class="card create-post">

          <div class="create-top">

            <img
              id="currentAvatar"
              class="create-avatar"
              src="https://ui-avatars.com/api/?name=Rang"
              alt="الصورة الشخصية"
            >

            <textarea
              id="postText"
              class="post-textarea"
              placeholder="بمَ تفكر اليوم؟ شارك لحظاتك..."
            ></textarea>

          </div>


          <div
            id="selectedFile"
            class="selected-file"
          >

            <span id="selectedFileName"></span>

            <button
              class="remove-file"
              onclick="removeSelectedFile()"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>

          </div>


          <div class="create-actions">

            <div class="media-actions">

              <button
                class="media-btn"
                onclick="document.getElementById('imageInput').click()"
              >
                <i class="fa-regular fa-image"></i>
                صورة
              </button>

              <button
                class="media-btn"
                onclick="document.getElementById('videoInput').click()"
              >
                <i class="fa-solid fa-video"></i>
                فيديو
              </button>

            </div>


            <button
              id="publishBtn"
              class="publish-btn"
              onclick="publishPost()"
            >
              نشر
            </button>

          </div>


          <input
            id="imageInput"
            type="file"
            accept="image/*"
            hidden
            onchange="handleFileSelect(this,'image')"
          >

          <input
            id="videoInput"
            type="file"
            accept="video/*"
            hidden
            onchange="handleFileSelect(this,'video')"
          >

          <div id="postMessage"></div>

        </div>


        <!-- المنشورات -->

        <div id="postsContainer">

          <div class="loading">
            جاري تحميل المنشورات...
          </div>

        </div>

      </section>


      <!-- الأصدقاء -->

      <section
        id="friendsSection"
        class="section"
      >

        <h2 class="section-title">
          <i class="fa-solid fa-user-group"></i>
          الأصدقاء
        </h2>


        <div class="card search-friend">

          <input
            id="friendSearchInput"
            placeholder="ابحث باسم المستخدم أو الاسم..."
          >

          <button
            class="primary-btn"
            onclick="searchFriends()"
          >
            بحث
          </button>

        </div>


        <div
          id="friendSearchResults"
          class="card"
        ></div>


        <h3 style="margin:20px 0 10px;">
          طلبات الصداقة
        </h3>


        <div
          id="friendRequests"
          class="card"
        ></div>


        <h3 style="margin:20px 0 10px;">
          أصدقائي
        </h3>


        <div
          id="friendsList"
          class="card"
        ></div>

      </section>


      <!-- الاختبارات -->

      <section
        id="testsSection"
        class="section"
      >

        <h2 class="section-title">
          <i class="fa-solid fa-file-pen"></i>
          الاختبارات
        </h2>

        <div id="testsContainer"></div>

      </section>


      <!-- الملف الشخصي -->

      <section
        id="profileSection"
        class="section"
      >

        <h2 class="section-title">
          <i class="fa-solid fa-user"></i>
          الملف الشخصي
        </h2>


        <div class="card profile-mini">

          <img
            id="profileAvatar"
            src="https://ui-avatars.com/api/?name=Rang"
            alt="الصورة الشخصية"
          >

          <h3 id="profileName">
            مستخدم Rang
          </h3>

          <p id="profileUsername"></p>

          <p
            id="profileEmail"
            style="margin-top:8px;"
          ></p>

          <p
            id="profileType"
            style="margin-top:8px;"
          ></p>

        </div>

      </section>


    </main>

  </div>

</div>


<!-- قائمة الهاتف -->

<nav class="mobile-nav">

  <button
    class="mobile-nav-btn active"
    onclick="showMobileSection('homeSection',this)"
  >
    <i class="fa-solid fa-house"></i>
    <span>الرئيسية</span>
  </button>


  <button
    class="mobile-nav-btn"
    onclick="showMobileSection('friendsSection',this)"
  >
    <i class="fa-solid fa-user-group"></i>
    <span>الأصدقاء</span>
  </button>


  <button
    class="mobile-nav-btn"
    onclick="showMobileSection('testsSection',this)"
  >
    <i class="fa-solid fa-file-pen"></i>
    <span>الاختبارات</span>
  </button>


  <button
    class="mobile-nav-btn"
    onclick="showMobileSection('profileSection',this)"
  >
    <i class="fa-solid fa-user"></i>
    <span>حسابي</span>
  </button>


  <button
    class="mobile-nav-btn logout-mobile"
    onclick="logout()"
  >
    <i class="fa-solid fa-right-from-bracket"></i>
    <span>خروج</span>
  </button>

</nav>


<script>

let currentUser=null;

let currentProfile=null;

let selectedFile=null;

let selectedMediaType=null;


/* أدوات */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getAvatar(name){

/* رفع الوسائط */

async function uploadPostMedia(file){

  if(!file){

    return null;

  }


  const ext=
    file.name.includes(".")
    ?file.name.split(".").pop()
    :"bin";


  const path=
    currentUser.id+
    "/"+
    Date.now()+
    "-"+
    Math.random()
      .toString(36)
      .substring(2,9)+
    "."+
    ext.toLowerCase();


  const {
    error
  }=
    await supabaseClient
      .storage
      .from("post-media")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:file.type
        }
      );


  if(error){

    throw error;

  }


  const {
    data
  }=
    supabaseClient
      .storage
      .from("post-media")
      .getPublicUrl(path);


  return data.publicUrl;

}

        .from("posts")

            ?currentUser.id

/* تحميل المنشورات */

async function loadPosts(){

  const container=
    document.getElementById("postsContainer");


  container.innerHTML=
    getWelcomePostHTML();


  try{

    const {
      data:posts,
      error
    }=
      await supabaseClient
        .from("posts")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(50);


    if(error){

      throw error;

    }


    if(!posts || posts.length===0){

      return;

    }


    const ids=[
      ...new Set(
        posts
          .map(function(post){

            return post.author_id ||
                   post.teacher_id;

          })
          .filter(Boolean)
      )
    ];


    let profiles={};


    if(ids.length){

      const {
        data
      }=
        await supabaseClient
          .from("profiles")
          .select(
            "id,name,username,account_type"
          )
          .in("id",ids);


      (data || []).forEach(function(profile){

        profiles[profile.id]=profile;

      });

    }


    const postIds=
      posts.map(function(post){

        return post.id;

      });


    let likes=[];

    let comments=[];

    let shares=[];


    if(postIds.length){

      const likesResult=
        await supabaseClient
          .from("post_likes")
          .select("post_id,user_id")
          .in("post_id",postIds);


      likes=likesResult.data || [];


      const commentsResult=
        await supabaseClient
          .from("post_comments")
          .select(
            "id,post_id,user_id,comment,created_at"
          )
          .in("post_id",postIds)
          .order(
            "created_at",
            {
              ascending:true
            }
          );


      comments=commentsResult.data || [];


      const sharesResult=
        await supabaseClient
          .from("post_shares")
          .select("post_id")
          .in("post_id",postIds);


      shares=sharesResult.data || [];

    }


    const commentUserIds=[
      ...new Set(
        comments
          .map(function(comment){

            return comment.user_id;

          })
      )
    ];


    if(commentUserIds.length){

      const {
        data:commentProfiles
      }=
        await supabaseClient
          .from("profiles")
          .select(
            "id,name,username"
          )
          .in("id",commentUserIds);


      (commentProfiles || [])
        .forEach(function(profile){

          profiles[profile.id]=profile;

        });

    }


    posts.forEach(function(post){

      const authorId=
        post.author_id ||
        post.teacher_id;


      const profile=
        profiles[authorId] || {};


      const authorName=
        profile.name ||
        "مستخدم Rang";


      const username=
        profile.username ||
        "rang_user";


      const postLikes=
        likes.filter(function(like){

          return like.post_id===post.id;

        });


      const liked=
        postLikes.some(function(like){

          return like.user_id===currentUser.id;

        });


      const postComments=
        comments.filter(function(comment){

          return comment.post_id===post.id;

        });


      const shareCount=
        shares.filter(function(share){

          return share.post_id===post.id;

        }).length;


      let mediaHTML="";


      if(
        post.media_url &&
        post.media_type==="image"
      ){

        mediaHTML=`

          <img
            class="post-media"
            src="${escapeHTML(post.media_url)}"
            alt="صورة المنشور"
            loading="lazy"
          >

        `;

      }


      if(
        post.media_url &&
        post.media_type==="video"
      ){

        mediaHTML=`

          <video
            class="post-media"
            controls
            preload="metadata"
          >

            <source
              src="${escapeHTML(post.media_url)}"
            >

          </video>

        `;

      }


      const commentsHTML=
        postComments.length
        ?
        postComments.map(function(comment){

          const user=
            profiles[comment.user_id] || {};


          return `

            <div class="comment">

              <img
                class="comment-avatar"
                src="${getAvatar(user.name)}"
                alt=""
              >

              <div class="comment-content">

                <div class="comment-name">

                  ${escapeHTML(
                    user.name || "مستخدم"
                  )}

                </div>

                <div class="comment-text">

                  ${escapeHTML(
                    comment.comment
                  )}

                </div>

              </div>

            </div>

          `;

        }).join("")
        :
        `

          <div class="empty-comments">
            لا توجد تعليقات حتى الآن.
          </div>

        `;


      const article=
        document.createElement("article");


      article.className=
        "card post-card";


      article.innerHTML=`

        <div class="post-header">

          <img
            class="post-author-avatar"
            src="${getAvatar(authorName)}"
            alt="${escapeHTML(authorName)}"
          >

          <div class="post-author">

            <div class="post-author-name">

              ${escapeHTML(authorName)}

            </div>

            <div class="post-time">

              @${escapeHTML(username)}

              •

              ${formatDate(post.created_at)}

            </div>

          </div>

        </div>


        ${
          post.text
          ?
          `

            <div class="post-text">

              ${escapeHTML(post.text)}

            </div>

          `
          :
          ""
        }


        ${mediaHTML}


        <div class="post-actions">

          <button
            id="likeBtn_${post.id}"
            class="post-action ${liked ? "liked" : ""}"
            onclick="toggleLike(${post.id})"
          >

            <i class="${
              liked
              ? "fa-solid fa-heart"
              : "fa-regular fa-heart"
            }"></i>

            إعجاب

            <span id="likeCount_${post.id}">
              ${postLikes.length}
            </span>

          </button>


          <button
            class="post-action"
            onclick="toggleComments(${post.id})"
          >

            <i class="fa-regular fa-comment"></i>

            تعليق

            <span>
              ${postComments.length}
            </span>

          </button>


          <button
            class="post-action"
            onclick="sharePost(${post.id})"
          >

            <i class="fa-solid fa-share"></i>

            مشاركة

            <span>
              ${shareCount}
            </span>

          </button>

        </div>


        <div
          id="comments_${post.id}"
          class="comments-box"
        >

          <div class="comment-list">

            ${commentsHTML}

          </div>


          <div class="comment-form">

            <input
              id="commentInput_${post.id}"
              class="comment-input"
              placeholder="اكتب تعليقاً..."
              maxlength="500"
              onkeydown="commentEnter(event,${post.id})"
            >

            <button
              class="comment-send"
              onclick="addComment(${post.id})"
            >

              <i class="fa-solid fa-paper-plane"></i>

            </button>

          </div>

        </div>

      `;


      container.appendChild(article);

    });

  }
  catch(error){

    console.error(error);


    const errorBox=
      document.createElement("div");


    errorBox.className=
      "card empty";


    errorBox.innerHTML=`

      حدث خطأ أثناء تحميل المنشورات.

      <br><br>

      <small>
        ${escapeHTML(error.message)}
      </small>

    `;


    container.appendChild(errorBox);

  }

}

async function toggleLike(postId){

  try{

    const {
      data:existing,
      error:checkError
    }=
      await supabaseClient
        .from("post_likes")
        .select("id")
        .eq("post_id",postId)
        .eq("user_id",currentUser.id)
        .maybeSingle();


    if(checkError){

      throw checkError;

    }


    if(existing){

      const {
        error
      }=
        await supabaseClient
          .from("post_likes")
          .delete()
          .eq("id",existing.id)
          .eq("user_id",currentUser.id);


      if(error){

        throw error;

      }

    }
    else{

      const {
        error
      }=
        await supabaseClient
          .from("post_likes")
          .insert({

            post_id:postId,

            user_id:currentUser.id

          });


      if(error){

        throw error;

      }

    }


    await loadPosts();

  }
  catch(error){

    console.error(error);

    alert(
      "تعذر تنفيذ الإعجاب:\n"+
      error.message
    );

  }

}

/* البحث عن الأصدقاء */

function escapeLike(value){

  return String(value)

    .replace(/\\/g,"\\\\")

    .replace(/%/g,"\\%")

    .replace(/_/g,"\\_")

    .replace(/,/g,"")

    .replace(/\(/g,"")

    .replace(/\)/g,"");

}

/* طلب صداقة */

async function sendFriendRequest(receiverId){

  try{

    const {
      data:existing,
      error
    }=
      await supabaseClient
        .from("friend_requests")
        .select("id,status")
        .or(
          `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
        )
        .limit(1);


    if(error){

      throw error;

    }


    if(existing?.length){

      if(
        existing[0].status==="accepted"
      ){

        alert("أنتم أصدقاء بالفعل.");

      }
      else{

        alert("يوجد طلب صداقة بالفعل.");

      }

      return;

    }


    const {
      error:insertError
    }=
      await supabaseClient
        .from("friend_requests")
        .insert({

          sender_id:currentUser.id,

          receiver_id:receiverId,

          status:"pending"

        });


    if(insertError){

      throw insertError;

    }


    alert(
      "تم إرسال طلب الصداقة ✅"
    );

  }
  catch(error){

    alert(
      "تعذر إرسال الطلب:\n"+
      error.message
    );

  }

}


/* طلبات الصداقة */

async function loadFriendRequests(){

  const box=
    document.getElementById(
      "friendRequests"
    );


  try{

    const {
      data,
      error
    }=
      await supabaseClient
        .from("friend_requests")
        .select("*")
        .eq("receiver_id",currentUser.id)
        .eq("status","pending")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    if(!data?.length){

      box.innerHTML=`

        <div class="empty">
          لا توجد طلبات صداقة.
        </div>

      `;

      return;

    }


    const ids=
      data.map(function(request){

        return request.sender_id;

      });


    const {
      data:profiles
    }=
      await supabaseClient
        .from("profiles")
        .select(
          "id,name,username"
        )
        .in("id",ids);


    const map={};


    (profiles || []).forEach(function(profile){

      map[profile.id]=profile;

    });


    box.innerHTML="";


    data.forEach(function(request){

      const user=
        map[request.sender_id] || {};


      const item=
        document.createElement("div");


      item.className=
        "request-item";


      item.innerHTML=`

        <img
          class="friend-avatar"
          src="${getAvatar(user.name)}"
          alt=""
        >

        <div class="friend-info">

          <strong>
            ${escapeHTML(user.name || "مستخدم")}
          </strong>

          <small>
            @${escapeHTML(user.username || "")}
          </small>

        </div>


        <button
          class="small-btn accept-btn"
          onclick="updateFriendRequest(${request.id},'accepted')"
        >
          قبول
        </button>


        <button
          class="small-btn reject-btn"
          onclick="updateFriendRequest(${request.id},'rejected')"
        >
          رفض
        </button>

      `;


      box.appendChild(item);

    });

  }
  catch(error){

    box.innerHTML=`

      <div class="empty">
        ${escapeHTML(error.message)}
      </div>

    `;

  }

}


/* تحديث طلب الصداقة */

async function updateFriendRequest(id,status){

  try{

    const {
      error
    }=
      await supabaseClient
        .from("friend_requests")
        .update({
          status:status
        })
        .eq("id",id)
        .eq("receiver_id",currentUser.id);


    if(error){

      throw error;

    }


    await loadFriendRequests();

    await loadFriends();

  }
  catch(error){

    alert(error.message);

  }

}

/* الاختبارات */

async function loadTests(){

  const box=
    document.getElementById(
      "testsContainer"
    );


  box.innerHTML=`

    <div class="loading">
      جاري تحميل الاختبارات...
    </div>

  `;


  try{

    const grade=
      currentProfile?.grade;


    let query=
      supabaseClient
        .from("tests")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(grade){

      query=
        query.eq(
          "grade",
          grade
        );

    }


    const {
      data,
      error
    }=
      await query;


    if(error){

      throw error;

    }


    if(!data?.length){

      box.innerHTML=`

        <div class="card empty">
          لا توجد اختبارات متاحة حالياً.
        </div>

      `;

      return;

    }


    box.innerHTML="";


    data.forEach(function(test){

      let questions=
        test.questions;


      if(typeof questions==="string"){

        try{

          questions=
            JSON.parse(questions);

        }
        catch(error){

          questions=[];

        }

      }


      if(!Array.isArray(questions)){

        questions=[];

      }


      let html="";


      questions.forEach(function(q,index){

        html+=`

          <div class="question">

            <div class="question-title">

              ${index+1}.

              ${escapeHTML(q.question || "")}

            </div>


            ${
              Array.isArray(q.options)
              ?
              q.options.map(function(option,i){

                return `

                  <label class="option">

                    <input
                      type="radio"
                      name="test_${test.id}_${index}"
                      value="${i}"
                    >

                    ${escapeHTML(option)}

                  </label>

                `;

              }).join("")
              :
              ""
            }

          </div>

        `;

      });


      const card=
        document.createElement("div");


      card.className=
        "card test-card";


      card.innerHTML=`

        <h3>
          ${escapeHTML(test.title)}
        </h3>


        <div class="test-meta">

          المادة:

          ${escapeHTML(
            test.subject || "غير محددة"
          )}

        </div>


        ${html}


        <button
          class="primary-btn"
          style="margin-top:18px;"
          onclick="submitTest(${test.id})"
        >
          إرسال الإجابات
        </button>


        <div
          id="testResult_${test.id}"
        ></div>

      `;


      box.appendChild(card);

    });

  }
  catch(error){

    box.innerHTML=`

      <div class="card empty">

        ${escapeHTML(error.message)}

      </div>

    `;

  }

}


/* إرسال الاختبار */

async function submitTest(testId){

  try{

    const {
      data:test,
      error
    }=
      await supabaseClient
        .from("tests")
        .select("*")
        .eq("id",testId)
        .single();


    if(error){

      throw error;

    }


    let questions=
      test.questions;


    if(typeof questions==="string"){

      questions=
        JSON.parse(questions);

    }


    let score=0;


    questions.forEach(function(q,index){

      const selected=
        document.querySelector(
          `input[name="test_${testId}_${index}"]:checked`
        );


      if(
        selected &&
        Number(selected.value)===
        Number(q.correct)
      ){

        score++;

      }

    });


    const {
      error:resultError
    }=
      await supabaseClient
        .from("results")
        .insert({

          test_id:test.id,

          teacher_id:test.teacher_id,

          student_id:currentUser.id,

          student_name:
            currentProfile?.name ||
            "مستخدم Rang",

          grade:
            currentProfile?.grade || null,

          test_title:test.title,

          score:score,

          total:questions.length

        });


    if(resultError){

      throw resultError;

    }


    document.getElementById(
      "testResult_"+testId
    ).innerHTML=`

      <div class="message success">

        تم إرسال الاختبار ✅

        <br>

        نتيجتك:

        <strong>
          ${score} / ${questions.length}
        </strong>

      </div>

    `;

  }
  catch(error){

    alert(
      "تعذر إرسال الاختبار:\n"+
      error.message
    );

  }

}
