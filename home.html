<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rang Social - الصفحة الرئيسية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

:root{
  --primary:#6c5ce7;
  --primary-hover:#5b4bc4;
  --bg:#f4f6f9;
  --text:#2d3436;
  --muted:#636e72;
  --card:#fff;
  --border:#e2e8f0;
  --danger:#e74c3c;
  --success:#00b894;
  --shadow:0 4px 15px rgba(0,0,0,.05);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Tajawal",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.navbar{
  position:sticky;
  top:0;
  z-index:1000;
  height:65px;
  background:#fff;
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);
}

.nav-container{
  max-width:1200px;
  height:100%;
  margin:auto;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:var(--primary);
  font-size:25px;
  font-weight:700;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:8px;
}

.search-box{
  flex:1;
  max-width:430px;
  position:relative;
}

.search-box input{
  width:100%;
  border:1px solid var(--border);
  background:#f7f7fb;
  border-radius:25px;
  padding:11px 45px 11px 15px;
  outline:none;
}

.search-box i{
  position:absolute;
  right:17px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  border:none;
  background:#f4f4fa;
  width:40px;
  height:40px;
  border-radius:50%;
  color:var(--text);
}

.icon-btn:hover{
  color:var(--primary);
}

.nav-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.page-container{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
}

.layout{
  display:flex;
  gap:25px;
  align-items:flex-start;
}

.sidebar{
  width:250px;
  flex-shrink:0;
}

.main-content{
  flex:1;
  min-width:0;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.profile-mini{
  padding:20px;
  text-align:center;
}

.profile-mini img{
  width:75px;
  height:75px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:8px;
}

.profile-mini h3{
  font-size:17px;
  margin-bottom:4px;
}

.profile-mini p{
  color:var(--muted);
  font-size:13px;
}

.side-menu{
  padding:10px;
}

.menu-btn{
  width:100%;
  border:none;
  background:transparent;
  padding:13px;
  border-radius:10px;
  text-align:right;
  font-size:15px;
  color:var(--text);
  margin-bottom:3px;
}

.menu-btn i{
  width:27px;
  color:var(--primary);
}

.menu-btn:hover,
.menu-btn.active{
  background:#f0edff;
  color:var(--primary);
}

.logout-btn,
.logout-btn i{
  color:var(--danger);
}

.section{
  display:none;
}

.section.active{
  display:block;
}

/* إنشاء منشور */

.create-post{
  padding:18px;
}

.create-top{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.create-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
}

.post-textarea{
  flex:1;
  min-height:85px;
  resize:vertical;
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
  outline:none;
  font-size:15px;
  background:#fafbfc;
}

.post-textarea:focus{
  border-color:var(--primary);
  background:#fff;
}

.selected-file{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#f3f1ff;
  color:var(--primary);
  align-items:center;
  justify-content:space-between;
}

.selected-file.show{
  display:flex;
}

.remove-file{
  border:none;
  background:none;
  color:var(--danger);
}

.create-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--border);
  margin-top:15px;
  padding-top:12px;
}

.media-actions{
  display:flex;
  gap:5px;
}

.media-btn{
  border:none;
  background:transparent;
  padding:9px;
  border-radius:9px;
  color:var(--muted);
}

.media-btn:hover{
  background:#f3f1ff;
  color:var(--primary);
}

.publish-btn{
  border:none;
  background:var(--primary);
  color:white;
  padding:10px 22px;
  border-radius:9px;
  font-weight:700;
}

.publish-btn:hover{
  background:var(--primary-hover);
}

.publish-btn:disabled{
  opacity:.6;
}

/* المنشورات */

.post-card{
  padding:18px;
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-author-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.post-author{
  flex:1;
}

.post-author-name{
  font-weight:700;
}

.post-time{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.post-text{
  margin-top:15px;
  line-height:1.9;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-media{
  width:100%;
  max-height:600px;
  object-fit:contain;
  background:#f2f2f2;
  border-radius:12px;
  margin-top:14px;
}

.post-actions{
  display:flex;
  gap:5px;
  border-top:1px solid var(--border);
  margin-top:15px;
  padding-top:10px;
}

.post-action{
  flex:1;
  border:none;
  background:transparent;
  padding:10px;
  border-radius:9px;
  color:var(--muted);
}

.post-action:hover{
  background:#f5f5f7;
  color:var(--primary);
}

.post-action.liked{
  color:#e74c3c;
  font-weight:700;
}

/* التعليقات */

.comments-box{
  display:none;
  border-top:1px solid var(--border);
  margin-top:10px;
  padding-top:12px;
}

.comments-box.open{
  display:block;
}

.comment-list{
  max-height:300px;
  overflow-y:auto;
}

.comment{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.comment-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.comment-content{
  background:#f4f5f7;
  border-radius:12px;
  padding:8px 11px;
  flex:1;
}

.comment-name{
  font-weight:700;
  font-size:13px;
}

.comment-text{
  margin-top:3px;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-form{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.comment-input{
  flex:1;
  border:1px solid var(--border);
  border-radius:20px;
  padding:10px 14px;
  outline:none;
}

.comment-send{
  width:42px;
  border:none;
  border-radius:50%;
  background:var(--primary);
  color:white;
}

.empty-comments{
  text-align:center;
  color:var(--muted);
  padding:12px;
  font-size:13px;
}

/* أصدقاء */

.section-title{
  margin-bottom:15px;
  font-size:21px;
}

.search-friend{
  padding:15px;
  display:flex;
  gap:10px;
}

.search-friend input{
  flex:1;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px;
  outline:none;
}

.primary-btn{
  border:none;
  background:var(--primary);
  color:white;
  padding:10px 18px;
  border-radius:9px;
}

.friend-result,
.friend-item,
.request-item{
  padding:15px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
}

.friend-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
}

.friend-info{
  flex:1;
}

.friend-info strong{
  display:block;
}

.friend-info small{
  color:var(--muted);
}

.small-btn{
  border:none;
  padding:8px 12px;
  border-radius:8px;
  font-size:13px;
}

.accept-btn{
  background:var(--success);
  color:white;
}

.reject-btn{
  background:#eee;
  color:var(--danger);
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.spinner{
  animation:spin 1s linear infinite;
  display:inline-block;
  margin-left:7px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* الاختبارات */

.test-card{
  padding:18px;
}

.test-card h3{
  margin-bottom:6px;
}

.test-meta{
  color:var(--muted);
  font-size:13px;
}

.question{
  border-top:1px solid var(--border);
  margin-top:15px;
  padding-top:15px;
}

.question-title{
  font-weight:700;
  margin-bottom:10px;
}

.option{
  display:block;
  background:#fafafa;
  border:1px solid var(--border);
  border-radius:9px;
  padding:10px;
  margin:7px 0;
  cursor:pointer;
}

.message{
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  font-size:14px;
}

.success{
  background:#eafaf5;
  color:#008f72;
}

.error{
  background:#ffecec;
  color:#c0392b;
}

/* تعديلات الشاشات اللوحية (التابلت) */
@media(max-width: 1024px){
  .sidebar{
    width: 210px;
  }
}

/* تعديلات الهواتف المحمولة */
@media(max-width:768px){

  .search-box{
    display:none;
  }

  .sidebar{
    display:none;
  }

  .layout{
    display:block;
  }

  .page-container{
    margin-top:15px;
    padding:0 10px 70px 10px; /* مساحة إضافية من الأسفل */
  }

  .post-card,
  .create-post{
    padding:14px;
  }

  .post-actions{
    gap:0;
  }

}

</style>
</head>

<body>

<header class="navbar">

  <div class="nav-container">

    <a class="logo" href="#">
      <i class="fa-solid fa-shapes"></i>
      Rang
    </a>

    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        id="topSearch"
        placeholder="ابحث في Rang..."
      >

    </div>

    <div class="nav-actions">

      <button
        class="icon-btn"
        onclick="showSection('friendsSection')"
      >
        <i class="fa-solid fa-user-group"></i>
      </button>

      <button
        class="icon-btn"
        onclick="loadAllData()"
      >
        <i class="fa-solid fa-rotate"></i>
      </button>

      <img
        id="navAvatar"
        class="nav-avatar"
        src="https://ui-avatars.com/api/?name=Rang"
      >

    </div>

  </div>

</header>


<div class="page-container">

<div class="layout">


<!-- SIDEBAR -->

<aside class="sidebar">

  <div class="card profile-mini">

    <img
      id="sideAvatar"
      src="https://ui-avatars.com/api/?name=Rang"
    >

    <h3 id="sideName">
      مستخدم Rang
    </h3>

    <p id="sideUsername">
      @rang_user
    </p>

  </div>


  <div class="card side-menu">

    <button
      class="menu-btn active"
      onclick="showSection('homeSection',this)"
    >
      <i class="fa-solid fa-house"></i>
      الرئيسية
    </button>

    <button
      class="menu-btn"
      onclick="showSection('friendsSection',this)"
    >
      <i class="fa-solid fa-user-group"></i>
      الأصدقاء
    </button>

    <button
      class="menu-btn"
      onclick="showSection('testsSection',this)"
    >
      <i class="fa-solid fa-file-pen"></i>
      الاختبارات
    </button>

    <button
      class="menu-btn"
      onclick="showSection('profileSection',this)"
    >
      <i class="fa-solid fa-user"></i>
      الملف الشخصي
    </button>

    <button
      class="menu-btn logout-btn"
      onclick="logout()"
    >
      <i class="fa-solid fa-right-from-bracket"></i>
      تسجيل الخروج
    </button>

  </div>

</aside>


<main class="main-content">


<!-- =========================
     HOME
========================= -->

<section
  id="homeSection"
  class="section active"
>


<!-- CREATE POST -->

<div class="card create-post">

  <div class="create-top">

    <img
      id="currentAvatar"
      class="create-avatar"
      src="https://ui-avatars.com/api/?name=Rang"
    >

    <textarea
      id="postText"
      class="post-textarea"
      placeholder="بمَ تفكر اليوم؟ شارك لحظاتك..."
    ></textarea>

  </div>


  <div
    id="selectedFile"
    class="selected-file"
  >

    <span id="selectedFileName"></span>

    <button
      class="remove-file"
      onclick="removeSelectedFile()"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>

  </div>


  <div class="create-actions">

    <div class="media-actions">

      <button
        class="media-btn"
        onclick="document.getElementById('imageInput').click()"
      >
        <i class="fa-regular fa-image"></i>
        صورة
      </button>

      <button
        class="media-btn"
        onclick="document.getElementById('videoInput').click()"
      >

        فيديو
      </button>

    accept="image/*"
    hidden

  >

  <input
    id="videoInput"
    type="file"
    accept="video/*"
    hidden
    onchange="handleFileSelect(this,'video')"
  >

  <div id="postMessage"></div>

</div>


<!-- POSTS -->

<div id="postsContainer">

  <div class="loading">
    جاري تحميل المنشورات...
  </div>

</div>

</section>


<!-- =========================
     FRIENDS
========================= -->

<section
  id="friendsSection"
  class="section"
>

<h2 class="section-title">
  <i class="fa-solid fa-user-group"></i>
  الأصدقاء
</h2>


<div class="card search-friend">

  <input
    id="friendSearchInput"
    placeholder="ابحث باسم المستخدم أو الاسم..."
  >

  <button
    class="primary-btn"
    onclick="searchFriends()"
  >
    بحث
  </button>

</div>


<div
  id="friendSearchResults"
  class="card"
></div>


<h3 style="margin:20px 0 10px;">
  طلبات الصداقة
</h3>


<div
  id="friendRequests"
  class="card"
></div>


<h3 style="margin:20px 0 10px;">
  أصدقائي
</h3>

  id="friendsList"
  class="card"
></div>

</section>


<!-- =========================
     TESTS
========================= -->

<section
  id="testsSection"
  class="section"
>

<h2 class="section-title">
  <i class="fa-solid fa-file-pen"></i>
  الاختبارات
</h2>

<div id="testsContainer"></div>

</section>


<!-- =========================
     PROFILE
========================= -->

<section
  id="profileSection"
  class="section"
>

<h2 class="section-title">
  <i class="fa-solid fa-user"></i>
  الملف الشخصي
</h2>


<div class="card profile-mini">

  <img
    id="profileAvatar"
    src="https://ui-avatars.com/api/?name=Rang"
  >

  <h3 id="profileName">
    مستخدم Rang
  </h3>

  <p id="profileUsername"></p>

  <p
    id="profileEmail"
    style="margin-top:8px;"
  ></p>

  <p
    id="profileType"

</main>

</div>

</div>


<script>

/* ========================================
   المتغيرات
======================================== */

let currentUser = null;
let currentProfile = null;

let selectedFile = null;
let selectedMediaType = null;


/* ========================================
   أدوات
======================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getAvatar(name){

  return "https://ui-avatars.com/api/?name="+
    encodeURIComponent(name || "Rang")+
    "&background=6c5ce7&color=fff&size=128";

}


function formatDate(date){

  if(!date) return "";

  return new Date(date).toLocaleString(
    "ar-EG",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* ========================================
   الأقسام
======================================== */

function showSection(id,button=null){

  document
    .querySelectorAll(".section")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");


  document
    .querySelectorAll(".menu-btn")
    .forEach(x=>x.classList.remove("active"));


  if(button){
    button.classList.add("active");
  }


  if(id==="friendsSection"){

    loadFriendRequests();
    loadFriends();

  }


  if(id==="testsSection"){

    loadTests();

  }

}


/* ========================================
   بدء الصفحة
======================================== */

async function initPage(){

  try{

    const {
      data:{session},
      error
    } = await supabaseClient.auth.getSession();


    if(error) throw error;


    if(!session){

      window.location.href="index.html";
      return;

    }


    currentUser=session.user;


    await loadProfile();
    await loadPosts();

  }
  catch(error){

    console.error(error);

    alert(
      "حدث خطأ:\n"+
      error.message
    );

  }

}


/* ========================================
   الملف الشخصي
======================================== */

async function loadProfile(){

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();


  if(error){

    console.error(error);
    return;

  }


  currentProfile=data;


  const name=
    data?.name ||
    currentUser.user_metadata?.name ||
    "مستخدم Rang";


  const username=
    data?.username ||
    currentUser.user_metadata?.username ||
    "rang_user";


  const avatar=getAvatar(name);


  document.getElementById("navAvatar").src=avatar;

  document.getElementById("sideAvatar").src=avatar;

  document.getElementById("currentAvatar").src=avatar;

  document.getElementById("profileAvatar").src=avatar;


  document.getElementById("sideName").textContent=name;

  document.getElementById("sideUsername").textContent=
    "@"+username;


  document.getElementById("profileName").textContent=name;

  document.getElementById("profileUsername").textContent=
    "@"+username;


  document.getElementById("profileEmail").textContent=
    currentUser.email || "";


  document.getElementById("profileType").textContent=
    data?.account_type==="teacher"
    ?"نوع الحساب: معلم"
    :"نوع الحساب: طالب";

}


/* ========================================
   الملفات
======================================== */

function handleFileSelect(input,type){

  const file=input.files[0];

  if(!file) return;


  selectedFile=file;
  selectedMediaType=type;


  document.getElementById(
    "selectedFileName"
  ).textContent=
    type==="image"
    ?"🖼️ "+file.name
    :"🎥 "+file.name;


  document
    .getElementById("selectedFile")
    .classList.add("show");

}


function removeSelectedFile(){

  selectedFile=null;
  selectedMediaType=null;

  document.getElementById("imageInput").value="";
  document.getElementById("videoInput").value="";

  document
    .getElementById("selectedFile")
    .classList.remove("show");

}


/* ========================================
   رفع صورة / فيديو
======================================== */

async function uploadPostMedia(file){

  if(!file) return null;


  const ext=
    file.name.includes(".")
    ?file.name.split(".").pop()
    :"bin";


  const path=
    currentUser.id+
    "/"+
    Date.now()+
    "-"+
    Math.random()
      .toString(36)
      .substring(2,9)+
    "."+
    ext.toLowerCase();


  const {
    error
  }=await supabaseClient
    .storage
    .from("post-media")
    .upload(
      path,
      file,
      {
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      }
    );


  if(error) throw error;


  const {
    data
  }=supabaseClient
    .storage
    .from("post-media")
    .getPublicUrl(path);


  return data.publicUrl;

}

async function publishPost(){

  const text=
    document
      .getElementById("postText")
      .value
      .trim();


  if(!text && !selectedFile){

    alert(
      "اكتب شيئاً أو اختر صورة / فيديو."
    );

    return;

  }


  const button=
    document.getElementById("publishBtn");


  button.disabled=true;

  button.textContent="جاري النشر...";


  try{

    let mediaUrl=null;


    if(selectedFile){

      mediaUrl=
        await uploadPostMedia(selectedFile);

    }


    const {
      error
    }=await supabaseClient
      .from("posts")
      .insert({

        author_id:currentUser.id,

        teacher_id:
          currentProfile?.account_type==="teacher"
          ?currentUser.id
          :null,

        grade:
          currentProfile?.grade || null,

        text:text || "",

        media_url:mediaUrl,

        media_type:selectedMediaType

      });


    if(error) throw error;


    document.getElementById("postText").value="";

    removeSelectedFile();

    await loadPosts();


  }
  catch(error){

    console.error(error);

    alert(
      "تعذر نشر المنشور:\n"+
      error.message
    );

  }
  finally{

    button.disabled=false;
    button.textContent="نشر";

  }

}


/* ========================================
   تحميل المنشورات
======================================== */

async function loadPosts(){

  const container=
    document.getElementById("postsContainer");


  container.innerHTML=`
    <div class="loading">
      جاري تحميل المنشورات...
    </div>
  `;


  try{

    const {
      data:posts,
      error
    }=await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(50);


    if(error) throw error;


    if(!posts || posts.length===0){

      container.innerHTML=`
        <div class="card empty">
          لا توجد منشورات حتى الآن.
        </div>
      `;

      return;

    }


    const ids=[
      ...new Set(
        posts
          .map(x=>x.author_id || x.teacher_id)
          .filter(Boolean)
      )
    ];


    let profiles={};


    if(ids.length){

      const {
        data
      }=await supabaseClient
        .from("profiles")
        .select(
          "id,name,username,account_type"
        )
        .in("id",ids);


      (data || []).forEach(x=>{
        profiles[x.id]=x;
      });

    }


    /* اللايكات */

    const postIds=posts.map(x=>x.id);


    const {
      data:likes
    }=await supabaseClient
      .from("post_likes")
      .select("post_id,user_id")
      .in("post_id",postIds);


    /* التعليقات */

    const {
      data:comments
    }=await supabaseClient
      .from("post_comments")
      .select("id,post_id,user_id,comment,created_at")
      .in("post_id",postIds)
      .order(
        "created_at",
        {ascending:true}
      );


    /* المشاركات */

    const {
      data:shares
    }=await supabaseClient
      .from("post_shares")
      .select("post_id")
      .in("post_id",postIds);


    const commentUserIds=[
      ...new Set(
        (comments || [])
          .map(x=>x.user_id)
      )
    ];


    if(commentUserIds.length){

      const {
        data:commentProfiles
      }=await supabaseClient
        .from("profiles")
        .select("id,name,username")
        .in("id",commentUserIds);


      (commentProfiles || [])
        .forEach(x=>{
          profiles[x.id]=x;
        });

    }


    container.innerHTML="";


    posts.forEach(post=>{

      const authorId=
        post.author_id ||
        post.teacher_id;


      const profile=
        profiles[authorId] || {};


      const authorName=
        profile.name ||
        "مستخدم Rang";


      const username=
        profile.username ||
        "rang_user";


      const postLikes=
        (likes || [])
          .filter(x=>x.post_id===post.id);


      const liked=
        postLikes.some(
          x=>x.user_id===currentUser.id
        );


      const postComments=
        (comments || [])
          .filter(x=>x.post_id===post.id);


      const shareCount=
        (shares || [])
          .filter(x=>x.post_id===post.id)
          .length;


      let mediaHTML="";


      if(
        post.media_url &&
        post.media_type==="image"
      ){

        mediaHTML=`
          <img
            class="post-media"
            src="${escapeHTML(post.media_url)}"
            alt="صورة المنشور"
            loading="lazy"
          >
        `;

      }


      if(
        post.media_url &&
        post.media_type==="video"
      ){

        mediaHTML=`
          <video
            class="post-media"
            controls
            preload="metadata"
          >
            <source
              src="${escapeHTML(post.media_url)}"
            >
          </video>
        `;

      }


      const commentsHTML=
        postComments.length
        ?postComments.map(comment=>{

          const user=
            profiles[comment.user_id] || {};


          return`

            <div class="comment">

              <img
                class="comment-avatar"
                src="${getAvatar(user.name)}"
              >

              <div class="comment-content">

                <div class="comment-name">
                  ${escapeHTML(
                    user.name || "مستخدم"
                  )}
                </div>

                <div class="comment-text">
                  ${escapeHTML(
                    comment.comment
                  )}
                </div>

              </div>

            </div>

          `;

        }).join("")
        :`
          <div class="empty-comments">
            لا توجد تعليقات حتى الآن.
          </div>
        `;


      const article=
        document.createElement("article");


      article.className=
        "card post-card";


      article.innerHTML=`

        <div class="post-header">

          <img
            class="post-author-avatar"
            src="${getAvatar(authorName)}"
          >

          <div class="post-author">

            <div class="post-author-name">
              ${escapeHTML(authorName)}
            </div>

            <div class="post-time">
              @${escapeHTML(username)}
              •
              ${formatDate(post.created_at)}
            </div>

          </div>

        </div>


        ${
          post.text
          ?`
            <div class="post-text">
              ${escapeHTML(post.text)}
            </div>
          `
          :""
        }


        ${mediaHTML}


        <div class="post-actions">

          <button
            id="likeBtn_${post.id}"
            class="post-action ${liked?"liked":""}"
            onclick="toggleLike(${post.id})"
          >

            <i class="${
              liked
              ?"fa-solid fa-heart"
              :"fa-regular fa-heart"
            }"></i>

            إعجاب

            <span id="likeCount_${post.id}">
              ${postLikes.length}
            </span>

          </button>


          <button
            class="post-action"
            onclick="toggleComments(${post.id})"
          >

            <i class="fa-regular fa-comment"></i>

            تعليق

            <span>
              ${postComments.length}
            </span>

          </button>


          <button
            class="post-action"
            onclick="sharePost(${post.id})"
          >

            <i class="fa-solid fa-share"></i>

            مشاركة

            <span>
              ${shareCount}
            </span>

          </button>

        </div>


        <div
          id="comments_${post.id}"
          class="comments-box"
        >

          <div class="comment-list">
            ${commentsHTML}
          </div>


          <div class="comment-form">

            <input
              id="commentInput_${post.id}"
              class="comment-input"
              placeholder="اكتب تعليقاً..."
              maxlength="500"
              onkeydown="commentEnter(event,${post.id})"
            >

            <button
              class="comment-send"
              onclick="addComment(${post.id})"
            >
              <i class="fa-solid fa-paper-plane"></i>
            </button>

          </div>

        </div>

      `;


      container.appendChild(article);

    });


  }
  catch(error){

    console.error(error);


    container.innerHTML=`

      <div class="card empty">

        حدث خطأ أثناء تحميل المنشورات.

        <br><br>

        <small>
          ${escapeHTML(error.message)}
        </small>

      </div>

    `;

  }

}


/* ========================================
   Like
======================================== */

async function toggleLike(postId){

  try{

    const {
      data:existing,
      error:checkError
    }=await supabaseClient
      .from("post_likes")
      .select("id")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();


    if(checkError) throw checkError;


    if(existing){

      const {
        error
      }=await supabaseClient
        .from("post_likes")
        .delete()
        .eq("id",existing.id)
        .eq("user_id",currentUser.id);


      if(error) throw error;

    }
    else{

      const {
        error
      }=await supabaseClient
        .from("post_likes")
        .insert({

          post_id:postId,
          user_id:currentUser.id

        });


      if(error) throw error;

    }


    await loadPosts();

  }
  catch(error){

    console.error(error);

    alert(
      "تعذر تنفيذ الإعجاب:\n"+
      error.message
    );

  }

}


/* ========================================
   التعليقات
======================================== */

function toggleComments(postId){

  const box=
    document.getElementById(
      "comments_"+postId
    );


  if(box){

    box.classList.toggle("open");

  }

}


function commentEnter(event,postId){

  if(
    event.key==="Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    addComment(postId);

  }

}


async function addComment(postId){

  const input=
    document.getElementById(
      "commentInput_"+postId
    );


  if(!input) return;


  const comment=
    input.value.trim();


  if(!comment){

    return;

  }


  try{

    const {
      error
    }=await supabaseClient
      .from("post_comments")
      .insert({

        post_id:postId,

        user_id:currentUser.id,

        comment:comment

      });


    if(error) throw error;


    input.value="";


    await loadPosts();


    setTimeout(()=>{

      const box=
        document.getElementById(
          "comments_"+postId
        );

      if(box){

        box.classList.add("open");

      }

    },100);

  }
  catch(error){

    console.error(error);

    alert(
      "تعذر إضافة التعليق:\n"+
      error.message
    );

  }

}


/* ========================================
   مشاركة
======================================== */

async function sharePost(postId){

  try{

    const {
      error
    }=await supabaseClient
      .from("post_shares")
      .insert({

        post_id:postId,

        user_id:currentUser.id

      });


    if(error) throw error;


    const shareUrl=
      window.location.origin+
      window.location.pathname+
      "?post="+postId;


    if(
      navigator.share
    ){

      await navigator.share({

        title:"Rang Social",

        text:"شاهد هذا المنشور على Rang Social",

        url:shareUrl

      });

    }
    else if(
      navigator.clipboard
    ){

      await navigator.clipboard.writeText(
        shareUrl
      );

      alert(
        "تم نسخ رابط المنشور ✅"
      );

    }
    else{

      alert(
        "تمت مشاركة المنشور ✅"
      );

    }


    await loadPosts();

  }
  catch(error){

    console.error(error);

    alert(
      "تعذر مشاركة المنشور:\n"+
      error.message
    );

  }

}

function escapeLike(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/%/g,"\\%")
    .replace(/_/g,"\\_")
    .replace(/,/g,"")
    .replace(/\(/g,"")     .replace(/\)/g,"");

}

      .getElementById("friendSearchInput")

    document.getElementById(
      "friendSearchResults"

async function sendFriendRequest(receiverId){

  try{

    const {
      data:existing,
      error
    }=await supabaseClient
      .from("friend_requests")
      .select("id,status")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
      )
      .limit(1);


    if(error) throw error;


    if(existing?.length){

      if(existing[0].status==="accepted")
        alert("أنتم أصدقاء بالفعل.");

      else
        alert("يوجد طلب صداقة بالفعل.");

      return;

    }


    const {
      error:insertError
    }=await supabaseClient
      .from("friend_requests")
      .insert({

        sender_id:currentUser.id,

        receiver_id:receiverId,

        status:"pending"

      });


    if(insertError) throw insertError;


    alert("تم إرسال طلب الصداقة ✅");

  }
  catch(error){

    alert(
      "تعذر إرسال الطلب:\n"+
      error.message
    );

  }

}

async function loadTests(){

  const box=
    document.getElementById(
      "testsContainer"
    );


  box.innerHTML=`
    <div class="loading">
      جاري تحميل الاختبارات...
    </div>
  `;


  try{

    const grade=
      currentProfile?.grade;


    let query=
      supabaseClient
        .from("tests")
        .select("*")
        .order(
          "created_at",
          {ascending:false}
        );


    if(grade){

      query=query.eq(
        "grade",
        grade
      );

    }


    const {
      data,
      error
    }=await query;


    if(error) throw error;


    if(!data?.length){

      box.innerHTML=`
        <div class="card empty">
          لا توجد اختبارات متاحة حالياً.
        </div>
      `;

      return;

    }


    box.innerHTML="";


    data.forEach(test=>{

      let questions=test.questions;


      if(typeof questions==="string"){

        try{
          questions=JSON.parse(questions);
        }
        catch{
          questions=[];
        }

      }


      if(!Array.isArray(questions))
        questions=[];


      let html="";


      questions.forEach((q,index)=>{

        html+=`

          <div class="question">

            <div class="question-title">
              ${index+1}.
              ${escapeHTML(q.question || "")}
            </div>

            ${
              Array.isArray(q.options)
              ?q.options.map((option,i)=>`

                <label class="option">

                  <input
                    type="radio"
                    name="test_${test.id}_${index}"
                    value="${i}"
                  >

                  ${escapeHTML(option)}

                </label>

              `).join("")
              :""
            }

          </div>

        `;

      });


      const card=
        document.createElement("div");


      card.className=
        "card test-card";


      card.innerHTML=`

        <h3>
          ${escapeHTML(test.title)}
        </h3>

        <div class="test-meta">
          المادة:
          ${escapeHTML(test.subject || "غير محددة")}
        </div>

        ${html}

        <button
          class="primary-btn"
          style="margin-top:18px;"
          onclick="submitTest(${test.id})"
        >
          إرسال الإجابات
        </button>

        <div
          id="testResult_${test.id}"
        ></div>

      `;


      box.appendChild(card);

    });


  }
  catch(error){

    box.innerHTML=`
      <div class="card empty">
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


async function submitTest(testId){

  try{

    const {
      data:test,
      error
    }=await supabaseClient
      .from("tests")
      .select("*")
      .eq("id",testId)
      .single();


    if(error) throw error;


    let questions=test.questions;


    if(typeof questions==="string")
      questions=JSON.parse(questions);


    let score=0;


    questions.forEach((q,index)=>{

      const selected=
        document.querySelector(
          `input[name="test_${testId}_${index}"]:checked`
        );


      if(
        selected &&
        Number(selected.value)===
        Number(q.correct)
      ){

        score++;

      }

    });


    const {
      error:resultError
    }=await supabaseClient
      .from("results")
      .insert({

        test_id:test.id,

        teacher_id:test.teacher_id,

        student_id:currentUser.id,

        student_name:
          currentProfile?.name ||
          "مستخدم Rang",

        grade:
          currentProfile?.grade || null,

        test_title:test.title,

        score:score,

        total:questions.length

      });


    if(resultError) throw resultError;


    document.getElementById(
      "testResult_"+testId
    ).innerHTML=`

      <div class="message success">
        تم إرسال الاختبار ✅
        <br>
        نتيجتك:
        <strong>
          ${score} / ${questions.length}
        </strong>
      </div>

    `;

  }
  catch(error){

    alert(
      "تعذر إرسال الاختبار:\n"+
      error.message
    );

  }

}
