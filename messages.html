<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Rang Social - المراسلة</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<style>

:root{
  --primary:#6c5ce7;
  --primary-hover:#5b4bc4;
  --bg:#f4f6f9;
  --text:#2d3436;
  --muted:#636e72;
  --card:#ffffff;
  --border:#e2e8f0;
  --shadow:0 4px 15px rgba(0,0,0,.05);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:"Tajawal",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}


/* =========================
   NAVBAR
========================= */

.navbar{
  height:65px;
  background:#fff;
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);
  position:sticky;
  top:0;
  z-index:100;
}

.nav-container{
  max-width:1200px;
  height:100%;
  margin:auto;
  padding:0 15px;

  display:flex;
  align-items:center;
  justify-content:flex-start;

  gap:12px;
}

.back-btn{
  width:42px;
  height:42px;

  border:none;
  border-radius:50%;

  background:#f4f4fa;
  color:var(--text);

  font-size:16px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.back-btn:hover{
  color:var(--primary);
  background:#f0edff;
}

.logo{
  color:var(--primary);
  font-size:25px;
  font-weight:700;
}


/* =========================
   PAGE
========================= */

.page{
  width:100%;
  max-width:1200px;

  height:calc(100vh - 65px);

  margin:auto;

  padding:20px 15px;
}

.messages-layout{
  width:100%;
  height:100%;

  display:flex;
  gap:20px;

  min-height:0;
}


/* =========================
   FRIENDS PANEL
========================= */

.friends-panel{
  width:300px;
  flex-shrink:0;

  background:#fff;

  border:1px solid var(--border);
  border-radius:18px;

  box-shadow:var(--shadow);

  overflow:hidden;

  display:flex;
  flex-direction:column;
}

.panel-title{
  height:70px;

  padding:0 18px;

  border-bottom:1px solid var(--border);

  font-size:20px;
  font-weight:700;

  display:flex;
  align-items:center;
  gap:7px;
}

.panel-title i{
  color:#2d3436;
}

.friends-list{
  flex:1;

  overflow-y:auto;

  min-height:0;
}

.friend{
  width:100%;

  border:none;

  background:#fff;

  display:flex;
  align-items:center;

  gap:11px;

  padding:13px 15px;

  text-align:right;

  border-bottom:1px solid #f0f0f0;

  transition:.15s;
}

.friend:hover{
  background:#f8f7ff;
}

.friend.active{
  background:#f0edff;
}

.friend-avatar{
  width:48px;
  height:48px;

  flex-shrink:0;

  border-radius:50%;

  object-fit:cover;
}

.friend-info{
  flex:1;
  min-width:0;
}

.friend-name{
  font-size:14px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.friend-username{
  color:var(--muted);

  font-size:12px;

  margin-top:3px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================
   CHAT
========================= */

.chat{
  flex:1;

  min-width:0;
  min-height:0;

  background:#fff;

  border:1px solid var(--border);
  border-radius:18px;

  box-shadow:var(--shadow);

  display:flex;
  flex-direction:column;

  overflow:hidden;
}


/* =========================
   CHAT HEADER
========================= */

.chat-header{
  min-height:70px;

  padding:10px 18px;

  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;

  gap:12px;

  background:#fff;
}

.chat-header-avatar{
  width:48px;
  height:48px;

  border-radius:50%;

  object-fit:cover;
}

.chat-header-info{
  flex:1;

  min-width:0;
}

.chat-header-name{
  font-size:16px;
  font-weight:700;
}

.chat-header-username{
  color:var(--muted);

  font-size:12px;

  margin-top:2px;
}


/* =========================
   MESSAGES AREA
========================= */

.messages{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:25px;

  background:#f7f8fc;

  display:flex;
  flex-direction:column;

  gap:12px;
}

.messages::-webkit-scrollbar{
  width:6px;
}

.messages::-webkit-scrollbar-thumb{
  background:#d8d9e5;
  border-radius:10px;
}

.messages::-webkit-scrollbar-track{
  background:transparent;
}


/* =========================
   EMPTY CHAT
========================= */

.empty-chat{
  margin:auto;

  text-align:center;

  color:var(--muted);

  padding:20px;
}

.empty-chat i{
  display:block;

  font-size:45px;

  margin-bottom:12px;

  color:#c7c2f5;
}

.empty-chat small{
  display:block;

  margin-top:6px;

  color:#8b9297;
}


/* =========================
   MESSAGE ROW
========================= */

.message-row{
  width:100%;

  display:flex;
}

.message-row.mine{
  justify-content:flex-start;
}

.message-row.theirs{
  justify-content:flex-end;
}


/* =========================
   MESSAGE BUBBLE
========================= */

.message-bubble{
  width:fit-content;

  min-width:70px;

  max-width:65%;

  padding:10px 15px 7px;

  border-radius:18px;

  line-height:1.7;

  font-size:15px;

  word-break:normal;

  overflow-wrap:anywhere;

  white-space:pre-wrap;
}


/* رسائل المستخدم الحالي */

.mine .message-bubble{
  background:var(--primary);

  color:#fff;

  border-bottom-right-radius:5px;
}


/* رسائل الطرف الآخر */

.theirs .message-bubble{
  background:#fff;

  color:var(--text);

  border:1px solid var(--border);

  border-bottom-left-radius:5px;
}


/* =========================
   MESSAGE TIME
========================= */

.message-time{
  font-size:10px;

  opacity:.7;

  margin-top:3px;

  text-align:left;

  direction:rtl;

  white-space:nowrap;
}


/* =========================
   SEND AREA
========================= */

.send-area{
  border-top:1px solid var(--border);

  padding:12px 15px;

  display:flex;
  align-items:center;

  gap:10px;

  background:#fff;
}

.message-input{
  flex:1;

  height:48px;

  border:1px solid #d9dbe7;

  border-radius:25px;

  padding:0 18px;

  outline:none;

  font-size:15px;

  background:#fafbff;

  direction:rtl;

  transition:.15s;
}

.message-input:focus{
  border-color:var(--primary);

  background:#fff;
}

.message-input:disabled{
  background:#f1f2f5;

  cursor:not-allowed;
}

.send-btn{
  width:48px;
  height:48px;

  flex-shrink:0;

  border:none;

  border-radius:50%;

  background:var(--primary);

  color:#fff;

  font-size:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.15s;
}

.send-btn:hover{
  background:var(--primary-hover);
}

.send-btn:disabled{
  opacity:.6;

  cursor:not-allowed;
}


/* =========================
   LOADING
========================= */

.loading{
  padding:25px;

  text-align:center;

  color:var(--muted);
}


/* =========================
   ERROR
========================= */

.error{
  padding:25px;

  text-align:center;

  color:#e74c3c;

  font-size:14px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  body{
    overflow:hidden;
  }

  .navbar{
    height:60px;
  }

  .nav-container{
    padding:0 12px;
  }

  .logo{
    font-size:22px;
  }

  .page{
    height:calc(100vh - 60px);

    padding:0;
  }

  .messages-layout{
    display:block;
  }

  .friends-panel{
    display:none;
  }

  .chat{
    width:100%;
    height:100%;

    border-radius:0;

    border-left:none;
    border-right:none;
    border-bottom:none;

    box-shadow:none;
  }

  .chat-header{
    min-height:65px;

    padding:8px 13px;
  }

  .chat-header-avatar{
    width:44px;
    height:44px;
  }

  .messages{
    padding:18px 12px;

    gap:10px;
  }

  .message-bubble{
    max-width:82%;

    font-size:14px;

    padding:9px 13px 6px;
  }

  .send-area{
    padding:9px;
  }

  .message-input{
    height:46px;

    font-size:14px;
  }

  .send-btn{
    width:46px;
    height:46px;
  }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

  .message-bubble{
    max-width:88%;
  }

  .messages{
    padding:15px 8px;
  }

}

</style>

</head>


<body>


<header class="navbar">

  <div class="nav-container">

    <button
      class="back-btn"
      onclick="goHome()"
      title="العودة"
    >
      <i class="fa-solid fa-arrow-right"></i>
    </button>

    <div class="logo">
      Rang
    </div>

  </div>

</header>


<div class="page">

  <div class="messages-layout">


    <!-- قائمة الأصدقاء -->

    <aside class="friends-panel">

      <div class="panel-title">

        <i class="fa-solid fa-comments"></i>

        المراسلة

      </div>


      <div
        id="friendsList"
        class="friends-list"
      >

        <div class="loading">
          جاري تحميل الأصدقاء...
        </div>

      </div>

    </aside>


    <!-- المحادثة -->

    <main class="chat">


      <div
        id="chatHeader"
        class="chat-header"
      >

        <div class="empty-chat">

          <i class="fa-regular fa-comments"></i>

          <div>
            اختر صديقًا لبدء المحادثة
          </div>

        </div>

      </div>


      <div
        id="messages"
        class="messages"
      >

        <div class="empty-chat">

          <i class="fa-regular fa-message"></i>

          <div>
            اختر صديقًا من القائمة
          </div>

        </div>

      </div>


      <div class="send-area">

        <input
          id="messageInput"
          class="message-input"
          type="text"
          placeholder="اكتب رسالة..."
          maxlength="2000"
          autocomplete="off"
          disabled
        >


        <button
          id="sendButton"
          class="send-btn"
          onclick="sendMessage()"
          disabled
          title="إرسال"
        >

          <i class="fa-solid fa-paper-plane"></i>

        </button>

      </div>


    </main>


  </div>

</div>


<script>


/* =========================
   المتغيرات
========================= */

let currentUser=null;

let currentProfile=null;

let selectedFriend=null;

let currentConversationId=null;

let realtimeChannel=null;


/* =========================
   أدوات
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getAvatar(name){

  return "https://ui-avatars.com/api/?name="+
    encodeURIComponent(name || "Rang")+
    "&background=6c5ce7&color=fff&size=128";

}


function formatTime(date){

  if(!date)
    return "";

  return new Date(date).toLocaleString(
    "ar-EG",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );

}


function goHome(){

  window.location.href="home.html";

}


/* =========================
   تشغيل الصفحة
========================= */

async function initPage(){

  try{

    const {
      data:{session},
      error
    }=await supabaseClient.auth.getSession();


    if(error)
      throw error;


    if(!session){

      window.location.href="index.html";

      return;

    }


    currentUser=session.user;


    const {
      data,
      error:profileError
    }=await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();


    if(profileError)
      throw profileError;


    currentProfile=data;


    await loadFriends();


    setupRealtime();


    checkUrlUser();

  }
  catch(error){

    console.error(error);


    document.getElementById(
      "friendsList"
    ).innerHTML=`

      <div class="error">

        ${escapeHTML(error.message)}

      </div>

    `;

  }

}


/* =========================
   تحميل الأصدقاء
========================= */

async function loadFriends(){

  const box=
    document.getElementById(
      "friendsList"
    );


  try{

    const {
      data,
      error
    }=await supabaseClient
      .from("friend_requests")
      .select("*")
      .eq("status","accepted")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      );


    if(error)
      throw error;


    if(!data?.length){

      box.innerHTML=`

        <div class="loading">
          لا يوجد أصدقاء حتى الآن.
        </div>

      `;

      return;

    }


    const ids=data.map(x=>

      x.sender_id===currentUser.id

      ?x.receiver_id

      :x.sender_id

    );


    const {
      data:profiles,
      error:profilesError
    }=await supabaseClient
      .from("profiles")
      .select(
        "id,name,username"
      )
      .in("id",ids);


    if(profilesError)
      throw profilesError;


    box.innerHTML="";


    (profiles || []).forEach(user=>{

      const button=
        document.createElement("button");


      button.className="friend";


      button.dataset.userId=
        user.id;


      button.innerHTML=`

        <img
          class="friend-avatar"
          src="${getAvatar(user.name)}"
          alt=""
        >


        <div class="friend-info">

          <div class="friend-name">

            ${escapeHTML(
              user.name || "مستخدم"
            )}

          </div>


          <div class="friend-username">

            @${escapeHTML(
              user.username || ""
            )}

          </div>

        </div>

      `;


      button.onclick=()=>{

        openChat(user);

      };


      box.appendChild(button);

    });


  }
  catch(error){

    console.error(error);


    box.innerHTML=`

      <div class="error">

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   فتح محادثة
========================= */

async function openChat(user){

  selectedFriend=user;


  document
    .querySelectorAll(".friend")
    .forEach(button=>{

      button.classList.remove("active");


      if(
        button.dataset.userId===
        user.id
      ){

        button.classList.add("active");

      }

    });


  document.getElementById(
    "chatHeader"
  ).innerHTML=`

    <img
      class="chat-header-avatar"
      src="${getAvatar(user.name)}"
      alt=""
    >


    <div class="chat-header-info">

      <div class="chat-header-name">

        ${escapeHTML(
          user.name || "مستخدم"
        )}

      </div>


      <div class="chat-header-username">

        @${escapeHTML(
          user.username || ""
        )}

      </div>

    </div>

  `;


  document.getElementById(
    "messageInput"
  ).disabled=false;


  document.getElementById(
    "sendButton"
  ).disabled=false;


  await getOrCreateConversation();

}


/* =========================
   الحصول على المحادثة
========================= */

async function getOrCreateConversation(){

  if(!selectedFriend)
    return;


  const first=
    currentUser.id < selectedFriend.id

    ?currentUser.id

    :selectedFriend.id;


  const second=
    currentUser.id < selectedFriend.id

    ?selectedFriend.id

    :currentUser.id;


  const {
    data:existing,
    error
  }=await supabaseClient
    .from("conversations")
    .select("id")
    .eq("user1_id",first)
    .eq("user2_id",second)
    .maybeSingle();


  if(error)
    throw error;


  if(existing){

    currentConversationId=
      existing.id;

  }
  else{

    const {
      data:newConversation,
      error:createError
    }=await supabaseClient
      .from("conversations")
      .insert({

        user1_id:first,

        user2_id:second

      })
      .select("id")
      .single();


    if(createError)
      throw createError;


    currentConversationId=
      newConversation.id;

  }


  await loadMessages();

}


/* =========================
   تحميل الرسائل
========================= */

async function loadMessages(){

  const box=
    document.getElementById(
      "messages"
    );


  box.innerHTML=`

    <div class="loading">
      جاري تحميل الرسائل...
    </div>

  `;


  const {
    data,
    error
  }=await supabaseClient
    .from("messages")
    .select("*")
    .eq(
      "conversation_id",
      currentConversationId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    box.innerHTML=`

      <div class="error">

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

    return;

  }


  if(!data?.length){

    box.innerHTML=`

      <div class="empty-chat">

        <i class="fa-regular fa-comments"></i>

        <div>
          لا توجد رسائل بعد.
        </div>

        <small>
          ابدأ المحادثة الآن.
        </small>

      </div>

    `;

    return;

  }


  box.innerHTML="";


  data.forEach(message=>{

    renderMessage(message);

  });


  scrollMessages();

}


/* =========================
   عرض الرسالة
========================= */

function renderMessage(message){

  const box=
    document.getElementById(
      "messages"
    );


  if(
    document.querySelector(
      `[data-message-id="${message.id}"]`
    )
  ){

    return;

  }


  const mine=
    message.sender_id===
    currentUser.id;


  const row=
    document.createElement("div");


  row.className=
    "message-row "+
    (
      mine
      ?"mine"
      :"theirs"
    );


  row.dataset.messageId=
    message.id;


  row.innerHTML=`

    <div class="message-bubble">

      ${escapeHTML(
        message.message
      )}


      <div class="message-time">

        ${formatTime(
          message.created_at
        )}

      </div>

    </div>

  `;


  box.appendChild(row);

}


/* =========================
   إرسال الرسالة
========================= */

async function sendMessage(){

  if(!currentConversationId)
    return;


  const input=
    document.getElementById(
      "messageInput"
    );


  const text=
    input.value.trim();


  if(!text)
    return;


  const button=
    document.getElementById(
      "sendButton"
    );


  input.disabled=true;

  button.disabled=true;


  try{

    const {
      error
    }=await supabaseClient
      .from("messages")
      .insert({

        conversation_id:
          currentConversationId,

        sender_id:
          currentUser.id,

        message:text

      });


    if(error)
      throw error;


    input.value="";


  }
  catch(error){

    console.error(error);


    alert(
      "تعذر إرسال الرسالة:\n"+
      error.message
    );

  }
  finally{

    input.disabled=false;

    button.disabled=false;

    input.focus();

  }

}


/* =========================
   Enter
========================= */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key==="Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   Realtime
========================= */

function setupRealtime(){

  realtimeChannel=
    supabaseClient
      .channel(
        "rang-messages"
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        payload=>{

          const message=
            payload.new;


          if(
            message.conversation_id===
            currentConversationId
          ){

            const empty=
              document.querySelector(
                ".messages .empty-chat"
              );


            if(empty)
              empty.remove();


            renderMessage(message);


            scrollMessages();

          }

        }
      )
      .subscribe();

}


/* =========================
   النزول لآخر رسالة
========================= */

function scrollMessages(){

  const box=
    document.getElementById(
      "messages"
    );


  setTimeout(()=>{

    box.scrollTop=
      box.scrollHeight;

  },50);

}


/* =========================
   فتح مستخدم من الرابط
========================= */

async function checkUrlUser(){

  const params=
    new URLSearchParams(
      window.location.search
    );


  const userId=
    params.get("user");


  if(!userId)
    return;


  try{

    const {
      data:user,
      error
    }=await supabaseClient
      .from("profiles")
      .select(
        "id,name,username"
      )
      .eq("id",userId)
      .maybeSingle();


    if(error)
      throw error;


    if(user){

      await openChat(user);

    }

  }
  catch(error){

    console.error(error);

  }

}


/* =========================
   التشغيل
========================= */

initPage();

</script>

</body>

</html>
