<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المراسلة - Rang Social</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

:root{
    --primary:#6c5ce7;
    --primary-hover:#5b4bc4;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#2d3436;
    --muted:#636e72;
    --border:#e2e8f0;
    --message:#6c5ce7;
    --received:#ffffff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Tajawal",sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   الشريط العلوي
========================= */

.navbar{
    height:65px;
    background:#fff;
    border-bottom:1px solid var(--border);
    box-shadow:0 3px 12px rgba(0,0,0,.04);
    display:flex;
    align-items:center;
}

.nav-container{
    width:100%;
    max-width:1400px;
    margin:auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    text-decoration:none;
    color:var(--primary);
    font-size:25px;
    font-weight:700;
}

.back-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#f4f4fa;
    color:var(--text);
    font-size:18px;
}

.back-btn:hover{
    background:#eeeaff;
    color:var(--primary);
}

/* =========================
   الصفحة
========================= */

.page{
    width:100%;
    height:calc(100vh - 65px);
    max-width:1400px;
    margin:auto;
    padding:18px;
}

.messages-layout{
    height:100%;
    display:flex;
    gap:18px;
}

/* =========================
   قائمة المحادثات
========================= */

.conversations{
    width:340px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
    display:flex;
    flex-direction:column;
}

.conversations-header{
    padding:18px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.conversations-header h2{
    font-size:20px;
}

.conversations-header i{
    margin-left:5px;
}

.conversation-list{
    flex:1;
    overflow-y:auto;
}

.conversation{
    width:100%;
    border:none;
    background:#fff;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    text-align:right;
    border-bottom:1px solid #f0f0f0;
}

.conversation:hover{
    background:#faf9ff;
}

.conversation.active{
    background:#f0edff;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
}

.conversation-info{
    min-width:0;
    flex:1;
}

.conversation-name{
    font-weight:700;
    margin-bottom:4px;
}

.conversation-username{
    color:var(--muted);
    font-size:13px;
}

/* =========================
   المحادثة
========================= */

.chat{
    flex:1;
    min-width:0;
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
    display:flex;
    flex-direction:column;
}

.chat-header{
    height:82px;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
}

.chat-user-info{
    min-width:0;
}

.chat-user-name{
    font-weight:700;
    font-size:17px;
}

.chat-user-status{
    color:var(--muted);
    font-size:13px;
    margin-top:3px;
}

/* =========================
   الرسائل
========================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:22px;
    background:#f7f8fa;

    display:flex;
    flex-direction:column;
    gap:7px;
}

.empty-chat{
    margin:auto;
    text-align:center;
    color:var(--muted);
}

.empty-chat i{
    font-size:42px;
    margin-bottom:12px;
    color:#b9b2ed;
}

/* أهم جزء: حجم الرسالة مثل واتساب */

.message-row{
    width:100%;
    display:flex;
}

.message-row.sent{
    justify-content:flex-start;
}

.message-row.received{
    justify-content:flex-end;
}

.message-bubble{
    max-width:min(65%,500px);
    width:fit-content;

    padding:9px 13px 7px;

    border-radius:16px;

    line-height:1.6;
    font-size:15px;

    word-break:break-word;
    white-space:pre-wrap;

    box-shadow:0 1px 2px rgba(0,0,0,.08);
}

.message-row.sent .message-bubble{
    background:var(--message);
    color:#fff;

    border-bottom-right-radius:5px;
}

.message-row.received .message-bubble{
    background:var(--received);
    color:var(--text);

    border:1px solid #e9e9e9;

    border-bottom-left-radius:5px;
}

.message-time{
    display:block;
    margin-top:3px;
    font-size:10px;
    opacity:.65;
    text-align:left;
}

/* =========================
   إرسال الرسالة
========================= */

.message-form{
    min-height:72px;
    padding:10px 14px;

    border-top:1px solid var(--border);

    display:flex;
    align-items:center;
    gap:10px;

    background:#fff;
}

.message-input{
    flex:1;

    border:1px solid #aaa4d8;

    border-radius:25px;

    padding:12px 17px;

    outline:none;

    font-size:15px;

    background:#fff;

    min-width:0;
}

.message-input:focus{
    border-color:var(--primary);
}

.send-btn{
    width:48px;
    height:48px;

    border:none;
    border-radius:50%;

    background:var(--primary);
    color:#fff;

    font-size:17px;

    flex-shrink:0;
}

.send-btn:hover{
    background:var(--primary-hover);
}

.send-btn:disabled{
    opacity:.6;
}

/* =========================
   تحميل
========================= */

.loading{
    margin:auto;
    color:var(--muted);
    text-align:center;
}

.loading i{
    margin-left:6px;
}

/* =========================
   الهاتف
========================= */

@media(max-width:768px){

    body{
        overflow:hidden;
    }

    .navbar{
        height:60px;
    }

    .page{
        height:calc(100vh - 60px);
        padding:0;
    }

    .messages-layout{
        display:block;
    }

    .conversations{
        display:none;
    }

    .chat{
        height:100%;
        border-radius:0;
        border:none;
    }

    .chat-header{
        height:70px;
        padding:10px 14px;
    }

    .messages{
        padding:14px 10px;
    }

    .message-bubble{
        max-width:82%;
        font-size:15px;
    }

    .message-form{
        padding:8px;
    }

    .message-input{
        padding:11px 15px;
    }

    .send-btn{
        width:45px;
        height:45px;
    }

}

</style>

</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <button
            class="back-btn"
            onclick="window.location.href='home.html'"
        >
            <i class="fa-solid fa-arrow-right"></i>
        </button>

        <a
            href="home.html"
            class="logo"
        >
            Rang
        </a>

    </div>

</header>


<div class="page">

    <div class="messages-layout">


        <!-- قائمة المحادثات -->

        <aside class="conversations">

            <div class="conversations-header">

                <h2>
                    <i class="fa-solid fa-comments"></i>
                    المراسلة
                </h2>

            </div>

            <div
                id="conversationList"
                class="conversation-list"
            >

                <div class="loading">
                    جاري تحميل المحادثات...
                </div>

            </div>

        </aside>


        <!-- المحادثة -->

        <main class="chat">


            <header class="chat-header">

                <img
                    id="chatAvatar"
                    class="avatar"
                    src="https://ui-avatars.com/api/?name=Rang"
                >

                <div class="chat-user-info">

                    <div
                        id="chatUserName"
                        class="chat-user-name"
                    >
                        اختر صديقاً للمراسلة
                    </div>

                    <div
                        id="chatUserStatus"
                        class="chat-user-status"
                    >
                        المراسلة الخاصة
                    </div>

                </div>

            </header>


            <!-- الرسائل -->

            <div
                id="messages"
                class="messages"
            >

                <div class="empty-chat">

                    <i class="fa-regular fa-comments"></i>

                    <div>
                        اختر شخصاً من قائمة الأصدقاء لبدء المحادثة.
                    </div>

                </div>

            </div>


            <!-- إرسال -->

            <form
                id="messageForm"
                class="message-form"
            >

                <input
                    id="messageInput"
                    class="message-input"
                    type="text"
                    maxlength="2000"
                    autocomplete="off"
                    placeholder="اكتب رسالة..."
                    disabled
                >

                <button
                    id="sendBtn"
                    class="send-btn"
                    type="submit"
                    disabled
                >

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </form>

        </main>

    </div>

</div>


<script>

/* =========================
   المتغيرات
========================= */

let currentUser = null;
let currentProfile = null;

let selectedUser = null;

let profilesCache = {};


/* =========================
   أدوات
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getAvatar(name){

    return "https://ui-avatars.com/api/?name="+
        encodeURIComponent(name || "Rang")+
        "&background=6c5ce7&color=fff&size=128";

}


function formatTime(date){

    if(!date) return "";

    return new Date(date).toLocaleTimeString(
        "ar-EG",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================
   تشغيل الصفحة
========================= */

async function initPage(){

    try{

        const {
            data:{session},
            error
        } =
        await supabaseClient.auth.getSession();


        if(error)
            throw error;


        if(!session){

            window.location.href="index.html";
            return;

        }


        currentUser=session.user;


        await loadProfile();

        await loadFriends();


    }
    catch(error){

        console.error(error);

        alert(
            "حدث خطأ:\n"+
            error.message
        );

    }

}


/* =========================
   الملف الشخصي
========================= */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();


    if(error)
        throw error;


    currentProfile=data;

}


/* =========================
   تحميل الأصدقاء
========================= */

async function loadFriends(){

    const box=
        document.getElementById(
            "conversationList"
        );


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("friend_requests")
            .select("*")
            .eq("status","accepted")
            .or(
                `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
            );


        if(error)
            throw error;


        if(!data || !data.length){

            box.innerHTML=`

                <div class="empty-chat"
                     style="padding:30px 15px;">

                    <i class="fa-regular fa-user"></i>

                    <div>
                        لا يوجد أصدقاء حتى الآن.
                    </div>

                </div>

            `;

            return;

        }


        const ids=data.map(row =>

            row.sender_id === currentUser.id
                ? row.receiver_id
                : row.sender_id

        );


        const {
            data:profiles,
            error:profilesError
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "id,name,username,account_type"
            )
            .in("id",ids);


        if(profilesError)
            throw profilesError;


        profilesCache={};


        (profiles || []).forEach(user => {

            profilesCache[user.id]=user;

        });


        box.innerHTML="";


        (profiles || []).forEach(user => {

            const button=
                document.createElement("button");


            button.className="conversation";


            button.dataset.userId=user.id;


            button.innerHTML=`

                <img
                    class="avatar"
                    src="${getAvatar(user.name)}"
                >

                <div class="conversation-info">

                    <div class="conversation-name">
                        ${escapeHTML(
                            user.name || "مستخدم"
                        )}
                    </div>

                    <div class="conversation-username">
                        @${escapeHTML(
                            user.username || ""
                        )}
                    </div>

                </div>

            `;


            button.addEventListener(
                "click",
                () => openConversation(user)
            );


            box.appendChild(button);

        });


        /*
         * إذا كان هناك مستخدم محدد
         * من رابط الصفحة
         */

        const params=
            new URLSearchParams(
                window.location.search
            );


        const userId=
            params.get("user");


        if(userId){

            const user=
                profilesCache[userId];


            if(user)
                openConversation(user);

        }


    }
    catch(error){

        console.error(error);


        box.innerHTML=`

            <div class="empty-chat"
                 style="padding:30px 15px;">

                ${escapeHTML(error.message)}

            </div>

        `;

    }

}


/* =========================
   فتح محادثة
========================= */

async function openConversation(user){

    selectedUser=user;


    document
        .querySelectorAll(".conversation")
        .forEach(item => {

            item.classList.toggle(
                "active",
                item.dataset.userId === user.id
            );

        });


    document.getElementById(
        "chatAvatar"
    ).src=getAvatar(user.name);


    document.getElementById(
        "chatUserName"
    ).textContent=
        user.name || "مستخدم";


    document.getElementById(
        "chatUserStatus"
    ).textContent=
        "@"+(user.username || "");


    document.getElementById(
        "messageInput"
    ).disabled=false;


    document.getElementById(
        "sendBtn"
    ).disabled=false;


    await loadMessages();

}


/* =========================
   تحميل الرسائل
========================= */

async function loadMessages(){

    const box=
        document.getElementById(
            "messages"
        );


    if(!selectedUser){

        return;

    }


    box.innerHTML=`

        <div class="loading">

            <i class="fa-solid fa-spinner fa-spin"></i>

            جاري تحميل الرسائل...

        </div>

    `;


    try{

        /*
         * جلب الرسائل بين المستخدمين
         */

        const {
            data,
            error
        } =
        await supabaseClient
            .from("messages")
            .select(
                "id,sender_id,receiver_id,message,created_at"
            )
            .or(
                `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
            )
            .order(
                "created_at",
                {ascending:true}
            );


        if(error)
            throw error;


        if(!data || !data.length){

            box.innerHTML=`

                <div class="empty-chat">

                    <i class="fa-regular fa-comments"></i>

                    <div>
                        لا توجد رسائل بعد.
                    </div>

                    <small>
                        ابدأ المحادثة الآن 👋
                    </small>

                </div>

            `;

            return;

        }


        box.innerHTML="";


        data.forEach(message => {

            const row=
                document.createElement("div");


            const sent=
                message.sender_id ===
                currentUser.id;


            row.className=
                "message-row "+
                (sent ? "sent" : "received");


            const bubble=
                document.createElement("div");


            bubble.className=
                "message-bubble";


            bubble.innerHTML=`

                ${escapeHTML(
                    message.message
                )}

                <span class="message-time">

                    ${formatTime(
                        message.created_at
                    )}

                </span>

            `;


            row.appendChild(bubble);


            box.appendChild(row);

        });


        scrollToBottom();


    }
    catch(error){

        console.error(error);


        box.innerHTML=`

            <div class="empty-chat">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <div>
                    تعذر تحميل الرسائل.
                </div>

                <small>
                    ${escapeHTML(
                        error.message
                    )}
                </small>

            </div>

        `;

    }

}


/* =========================
   إرسال رسالة
========================= */

document
    .getElementById("messageForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            if(!selectedUser)
                return;


            const input=
                document.getElementById(
                    "messageInput"
                );


            const button=
                document.getElementById(
                    "sendBtn"
                );


            const text=
                input.value.trim();


            if(!text)
                return;


            input.disabled=true;
            button.disabled=true;


            try{

                const {
                    error
                } =
                await supabaseClient
                    .from("messages")
                    .insert({

                        sender_id:
                            currentUser.id,

                        receiver_id:
                            selectedUser.id,

                        message:text

                    });


                if(error)
                    throw error;


                input.value="";


                await loadMessages();


            }
            catch(error){

                console.error(error);


                alert(
                    "تعذر إرسال الرسالة:\n"+
                    error.message
                );

            }
            finally{

                input.disabled=false;
                button.disabled=false;

                input.focus();

            }

        }
    );


/* =========================
   Enter للإرسال
========================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key==="Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                document
                    .getElementById(
                        "messageForm"
                    )
                    .requestSubmit();

            }

        }
    );


/* =========================
   النزول لآخر رسالة
========================= */

function scrollToBottom(){

    const box=
        document.getElementById(
            "messages"
        );


    box.scrollTop=
        box.scrollHeight;

}


/* =========================
   تحديث الرسائل
========================= */

setInterval(
    async function(){

        if(selectedUser){

            await loadMessages();

        }

    },
    5000
);


/* =========================
   تشغيل
========================= */

initPage();

</script>

</body>
</html>
